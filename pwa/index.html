<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control TV</title>
<style>
  body {
    background: #111;
    color: #eee;
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  h1 { font-size: 20px; margin: 8px 0 16px; }
  .cfg {
    width: 100%;
    max-width: 320px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 12px;
  }
  .cfg-row { display: flex; gap: 6px; }
  #ipInput {
    flex: 1;
    background: #222;
    color: #eee;
    border: 1px solid #444;
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 15px;
  }
  .cfg button {
    background: #2a2a2a;
    color: #eee;
    border: 1px solid #444;
    border-radius: 8px;
    font-size: 14px;
    padding: 8px 12px;
    cursor: pointer;
    touch-action: manipulation;
  }
  .cfg button:active { background: #444; }
  #scanMsg { font-size: 13px; color: #999; min-height: 16px; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; width: 100%; max-width: 320px; }
  button {
    background: #2a2a2a;
    color: #eee;
    border: 1px solid #444;
    border-radius: 10px;
    font-size: 18px;
    padding: 18px 0;
    cursor: pointer;
    touch-action: manipulation;
    user-select: none;
  }
  button:active { background: #444; }
  button.power { background: #5a1e1e; border-color: #8a2a2a; font-weight: bold; grid-column: span 2; }
  .pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; max-width: 320px; margin-top: 10px; }
  .pad .empty { visibility: hidden; }
  #log {
    margin-top: 16px;
    font-size: 13px;
    color: #999;
    min-height: 20px;
    text-align: center;
    word-break: break-all;
  }
</style>
</head>
<body>
<h1>Control TV</h1>
<div class="cfg">
  <div class="cfg-row">
    <input id="ipInput" type="text" placeholder="IP de la TV (ej: 192.168.0.12)">
    <button id="applyBtn">Usar</button>
  </div>
  <button id="scanBtn">Buscar TV automaticamente</button>
  <div id="scanMsg"></div>
</div>
<div class="grid">
  <button class="power" id="power">POWER</button>
  <button id="volup">VOL +</button>
  <button id="chup">CANAL +</button>
  <button id="voldn">VOL -</button>
  <button id="chdn">CANAL -</button>
  <button id="back">RETROCEDER</button>
</div>
<div class="pad">
  <span class="empty"></span>
  <button id="up">&#9650;</button>
  <span class="empty"></span>
  <button id="left">&#9664;</button>
  <button id="ok">OK</button>
  <button id="right">&#9654;</button>
  <span class="empty"></span>
  <button id="down">&#9660;</button>
  <span class="empty"></span>
</div>
<div id="log"></div>

<script>
const log = document.getElementById('log');
const ipInput = document.getElementById('ipInput');
const scanMsg = document.getElementById('scanMsg');
let TV_IP = localStorage.getItem('tvIp') || "192.168.0.12";
ipInput.value = TV_IP;

function logMsg(msg) { log.textContent = msg; }

function setTvIp(ip) {
  TV_IP = ip;
  ipInput.value = ip;
  localStorage.setItem('tvIp', ip);
}

function sendKey(key) {
  fetch("http://" + TV_IP + ":1925/1/input/key", {
    method: "POST",
    headers: { "Content-Type": "text/plain" },
    body: JSON.stringify({ key: key })
  })
  .then(function(r) { logMsg("Enviado: " + key + " (" + r.status + ")"); })
  .catch(function(e) { logMsg("Error: " + e.message); });
}

function powerToggle() {
  fetch("http://" + TV_IP + ":1925/1/powerstate")
  .then(function(r) { return r.json(); })
  .then(function(d) {
    if (d.powerstate === "On") {
      sendKey("Standby");
    } else {
      logMsg("La TV esta apagada; encendela con el control fisico");
    }
  })
  .catch(function(e) { logMsg("Error: " + e.message); });
}

function scanTv() {
  var parts = TV_IP.split(".");
  var subnet = parts.slice(0, 3).join(".");
  scanMsg.textContent = "Escaneando " + subnet + ".1-254...";
  var found = [];
  var ips = [];
  for (var i = 1; i <= 254; i++) ips.push(i);
  var BATCH = 20;

  function tryIp(i) {
    var ip = subnet + "." + i;
    var ctrl = new AbortController();
    var timer = setTimeout(function() { ctrl.abort(); }, 600);
    return fetch("http://" + ip + ":1925/1/system", { signal: ctrl.signal })
      .then(function(r) {
        if (r.status === 200) return r.json();
        throw new Error("no");
      })
      .then(function(d) {
        clearTimeout(timer);
        if (d && d.name) found.push(ip + " (" + d.name + ")");
      })
      .catch(function() { clearTimeout(timer); });
  }

  function runBatch(start) {
    var batch = ips.slice(start, start + BATCH).map(tryIp);
    scanMsg.textContent = "Escaneando... " + Math.min(start + BATCH, 254) + "/254";
    return Promise.all(batch).then(function() {
      if (start + BATCH < 254) return runBatch(start + BATCH);
    });
  }

  runBatch(0).then(function() {
    if (found.length === 0) {
      scanMsg.textContent = "No se encontro ninguna TV. ¿El celular esta en el mismo WiFi que la TV? ¿La red es " + subnet + ".x?";
      return;
    }
    setTvIp(found[0].split(" ")[0]);
    scanMsg.textContent = "Encontrada: " + found.join(" | ");
    logMsg("TV configurada: " + TV_IP);
  });
}

function checkConnection() {
  var ctrl = new AbortController();
  var timer = setTimeout(function() { ctrl.abort(); }, 3000);
  fetch("http://" + TV_IP + ":1925/1/powerstate", { signal: ctrl.signal })
    .then(function(r) { return r.json(); })
    .then(function(d) {
      clearTimeout(timer);
      logMsg("Conectado a " + TV_IP + " — TV " + (d.powerstate === "On" ? "encendida" : "apagada"));
    })
    .catch(function(e) {
      clearTimeout(timer);
      logMsg("Sin conexion a " + TV_IP + " (" + e.name + "). ¿Mismo WiFi? ¿Chrome (no visor de WhatsApp)?");
    });
}

document.getElementById('applyBtn').onclick = function() {
  var ip = ipInput.value.trim();
  if (ip) { setTvIp(ip); logMsg("TV configurada: " + ip); }
};
document.getElementById('scanBtn').onclick = scanTv;
document.getElementById('power').onclick = powerToggle;
document.getElementById('volup').onclick = function() { sendKey("VolumeUp"); };
document.getElementById('voldn').onclick = function() { sendKey("VolumeDown"); };
document.getElementById('chup').onclick = function() { sendKey("ChannelStepUp"); };
document.getElementById('chdn').onclick = function() { sendKey("ChannelStepDown"); };
document.getElementById('up').onclick = function() { sendKey("CursorUp"); };
document.getElementById('down').onclick = function() { sendKey("CursorDown"); };
document.getElementById('left').onclick = function() { sendKey("CursorLeft"); };
document.getElementById('right').onclick = function() { sendKey("CursorRight"); };
document.getElementById('ok').onclick = function() { sendKey("Confirm"); };
document.getElementById('back').onclick = function() { sendKey("Back"); };
checkConnection();
</script>
</body>
</html>
